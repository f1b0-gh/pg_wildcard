# SPDX-License-Identifier: Apache-2.0
[package]
name = "wildcard-transport-format"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace]

[features]
production = ["antalya-rs/arrow"]

[[bin]]
name = "client-matrix-worker"
path = "src/matrix_worker.rs"
required-features = ["production"]

[[bin]]
name = "engine-worker"
path = "src/engine_worker.rs"

[dependencies]
antalya-rs = { version = "=0.1.0", default-features = false }
arrow-array = "=59.3.3"
arrow-schema = "=59.3.3"
arrow-ipc = { version = "=59.3.3", default-features = false }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

[dev-dependencies]
flatbuffers = "25.12.19"

[[bin]]
name = "control-worker"
path = "src/control_worker.rs"
