# SPDX-License-Identifier: Apache-2.0
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

defaults:
  run:
    shell: bash
    working-directory: pg_wildcard

jobs:
  library:
    name: Standalone library (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            flags: ''
          - name: all features
            flags: --all-features
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pg_wildcard
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - name: Test without a companion checkout
        run: |
          test ! -e ../antalya-rs
          cargo test --locked --manifest-path libwildcard/Cargo.toml ${{ matrix.flags }}

  quality:
    name: Format, policy, Clippy and package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pg_wildcard
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Publication, dependency policy and operations checks
        run: |
          python3 tools/check_publication.py
          python3 tools/check_dependency_policy.py
          cargo metadata --locked --manifest-path fuzz/Cargo.toml --format-version 1 > /dev/null
          python3 -m unittest discover -s tests/ci -v
          python3 -m unittest discover -s tests/operations -v
          python3 -m unittest discover -s tests/benchmarks -p 'test_*.py' -v
      - run: cargo fmt --manifest-path libwildcard/Cargo.toml --all -- --check
      - name: Backend cache ownership and allocation regressions
        run: |
          rustc --edition=2024 --test pg_wildcard/src/matcher_cache.rs -o "$RUNNER_TEMP/matcher-cache-tests"
          "$RUNNER_TEMP/matcher-cache-tests"
      - run: cargo clippy --locked --manifest-path libwildcard/Cargo.toml --all-features --all-targets -- -D warnings
      - name: Verify the self-contained crate package
        run: |
          test ! -e ../antalya-rs
          cargo package --locked --manifest-path libwildcard/Cargo.toml --all-features
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2, cargo-deny 0.21.0
        with:
          command: check licenses
          manifest-path: pg_wildcard/libwildcard/Cargo.toml
          arguments: --all-features --locked --config pg_wildcard/libwildcard/deny.toml
          rust-version: '1.99.1'

  parity:
    name: ClickHouse parity and Iceberg lake
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pg_wildcard
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install and record the test engines
        run: |
          python3 -m pip install -r .github/requirements.txt
          python3 -m pip freeze
          python3 -c 'import chdb; print(chdb.query("SELECT version()", "CSV"))'
      - run: python3 -m unittest discover -s libwildcard/tests/lake -v
      - run: python3 -m unittest discover -s libwildcard/tests/differential -p 'test_*.py' -v
      - name: Differential tests (Rust vs ClickHouse)
        run: |
          set -euo pipefail
          test ! -e ../antalya-rs
          for seed in 1 42 1234; do
            cargo run --locked -q --manifest-path libwildcard/Cargo.toml --features hot --example difftest_gen -- "$seed" | python3 libwildcard/tests/differential/run.py
          done
      - name: Benchmark correctness smoke (one percent; timings informational)
        run: |
          mkdir -p .local/benchmark-smoke
          cargo run --locked -q --manifest-path libwildcard/Cargo.toml --features hot --example sweep_benchmark_gen > .local/benchmark-smoke/spec.json
          python3 tests/benchmarks/smoke.py .local/benchmark-smoke/spec.json --out .local/benchmark-smoke/results
          for distribution in shared unrelated common short mixed domains urls paths commands; do
            cargo run --locked -q --manifest-path libwildcard/Cargo.toml --features hot --example sweep_benchmark_gen -- --comparison "$distribution" --indicators 100 --rows 10000 > ".local/benchmark-smoke/comparison-$distribution.json"
            python3 tests/benchmarks/comparison_smoke.py ".local/benchmark-smoke/comparison-$distribution.json" --require-watchlist-plan > ".local/benchmark-smoke/results/comparison-$distribution.log"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: benchmark-smoke
          path: pg_wildcard/.local/benchmark-smoke/results
          if-no-files-found: ignore
      - name: Iceberg and Puffin end-to-end
        run: |
          cargo build --locked --manifest-path libwildcard/Cargo.toml --features cold --bin wc-lake --example lake_scale_fixture
          python3 libwildcard/tests/lake/iceberg_e2e.py libwildcard/target/debug/wc-lake libwildcard/target/debug/examples/lake_scale_fixture

  consumer:
    name: Companion transport and FDW
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pg_wildcard
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - name: Verify registry dependencies and Arrow compatibility
        run: |
          test ! -e ../antalya-rs
          python3 tools/check_dependency_policy.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p wildcard-core -p wildcard-ch -p wildcard-puffin -p wildcard-lake --all-targets -- -D warnings
      - run: cargo test --locked -p wildcard-core -p wildcard-ch -p wildcard-puffin -p wildcard-lake
      - name: Shared-client JSON and Arrow transport regressions
        run: |
          cargo fmt --manifest-path tests/transport/Cargo.toml -- --check
          cargo test --locked --manifest-path tests/transport/Cargo.toml --all-features
          cargo clippy --locked --manifest-path tests/transport/Cargo.toml --all-features --all-targets -- -D warnings
      - name: PostgreSQL-independent FDW transport regressions
        run: |
          cargo fmt --manifest-path tests/fdw/harness/Cargo.toml -- --check
          cargo test --locked --manifest-path tests/fdw/harness/Cargo.toml
          cargo clippy --locked --manifest-path tests/fdw/harness/Cargo.toml --all-targets -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2, cargo-deny 0.21.0
        with:
          command: check licenses
          manifest-path: pg_wildcard/Cargo.toml
          arguments: --all-features --locked --config pg_wildcard/deny.toml
          rust-version: '1.99.1'
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2, cargo-deny 0.21.0
        with:
          command: check licenses
          manifest-path: pg_wildcard/tests/transport/Cargo.toml
          arguments: --all-features --locked --config pg_wildcard/deny.toml
          rust-version: '1.99.1'
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2, cargo-deny 0.21.0
        with:
          command: check licenses
          manifest-path: pg_wildcard/tests/fdw/harness/Cargo.toml
          arguments: --all-features --locked --config pg_wildcard/deny.toml
          rust-version: '1.99.1'
