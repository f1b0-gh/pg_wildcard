version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - /
      - /libwildcard
      - /tests/transport
      - /tests/fdw/harness
      - /fuzz
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # New Arrow/Parquet majors require a qualified client and consumer migration.
    ignore:
      - dependency-name: 'arrow-*'
        update-types: [version-update:semver-major]
      - dependency-name: parquet
        update-types: [version-update:semver-major]
    groups:
      arrow-clickhouse:
        patterns: ['arrow-*', parquet, clickhouse, antalya-rs]
      other-minor-and-patch:
        patterns: ['*']
        exclude-patterns: ['arrow-*', parquet, clickhouse, antalya-rs]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
    groups:
      test-engines:
        patterns: [chdb, chdb-core, pyiceberg, pyarrow]
